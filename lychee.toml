# Link check for Markdown and the slide deck (run in CI by lychee-action).
max_retries = 3
accept = ["200..=299", "429"]
exclude_path = ["node_modules", "experiments/github/runs", "experiments/playwright/runs", "docs/.vitepress"]
exclude = [
  # Endpoints that are not browsable pages.
  "^https?://localhost",
  "^https://api\\.githubcopilot\\.com/",
  "^https://github\\.com/login/oauth",
  # The docs site 404s until pages.yml first deploys from main. Remove after the first deploy.
  "^https://chief-builder\\.github\\.io/local-vs-remote-mcp/",
  # npm blocks non-browser clients with 403.
  "^https://www\\.npmjs\\.com/",
]
